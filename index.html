<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPTV">
<meta name="theme-color" content="#14121f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>IPTV Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--bg:#14121f;--panel:#1b1830;--panel2:#221e3b;--line:#2d2850;--tx:#efecfa;--mu:#948fb0;--ac:#ffb454;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}

/* Layout */
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#stage{flex:0 0 auto;width:100%;aspect-ratio:16/9;background:#000;position:relative}
#side{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
@media (min-width:700px),(orientation:landscape){
  #app{flex-direction:row}
  #app.side-right{flex-direction:row-reverse}
  #side{flex:0 0 min(360px,38vw)}
  #stage{flex:1;width:auto;aspect-ratio:auto;min-width:0}
  #app.side-left #side{border-right:1px solid var(--line)}
  #app.side-right #side{border-left:1px solid var(--line)}
}
.mini #stage{flex:0 0 0!important;width:0!important;height:0;aspect-ratio:auto;overflow:visible}
.mini #side{flex:1!important;border:0!important}

/* Sidebar */
#side header{display:flex;align-items:center;gap:6px;padding:12px 14px 6px}
.brand{flex:1;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--mu);letter-spacing:0}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--mu);display:grid;place-items:center}
.ib:active{background:var(--panel2)}
.tools{display:flex;gap:8px;padding:6px 14px 10px}
#q{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:0 12px;font-size:16px;outline:0}
#q:focus{border-color:var(--ac)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:0 12px;height:32px;color:var(--mu)}
.seg button.on{background:var(--panel2);color:var(--tx)}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.gh{width:100%;display:flex;align-items:center;gap:8px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-weight:600}
.gh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh em{font-style:normal;font-weight:400;color:var(--mu);font-size:13px}
.gh i{width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
.open>.gh i{transform:rotate(45deg)}
.gb{display:none}.open>.gb{display:block}
.ch{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 14px;content-visibility:auto;contain-intrinsic-size:auto 54px;border-left:3px solid transparent;cursor:pointer}
.ch:active{background:var(--panel2)}
.ch.on{background:rgba(255,180,84,.13);border-left-color:var(--ac)}
.lg{width:40px;height:40px;flex:none;border-radius:10px;background:var(--panel2);object-fit:contain;display:grid;place-items:center;color:var(--mu);font-weight:700}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{width:40px;height:40px;border:0;background:transparent;color:var(--line);display:grid;place-items:center;border-radius:50%}
.st.on{color:var(--ac)}
.empty{padding:28px 20px;color:var(--mu);text-align:center}

/* Player */
#player{position:absolute;inset:0;background:#000;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#v{width:100%;height:100%;object-fit:contain;background:#000}
#ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);text-align:center;padding:16px}
#player.has #ph{display:none}
#msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 16px;color:#fff;text-shadow:0 1px 6px #000;pointer-events:none}
#msg:empty{display:none}
#msg.err{color:#ffb4a8}
#ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .2s}
#ctl.show{opacity:1}
#ctl:not(.show) button{pointer-events:none}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 24px;background:linear-gradient(rgba(0,0,0,.7),transparent)}
#title{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px #000}
.bot{display:flex;justify-content:center;align-items:center;gap:18px;padding:24px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.cb{width:42px;height:42px;border-radius:50%;border:0;background:rgba(20,18,31,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center}
.cb.big{width:54px;height:54px}
#bPip{font-size:12px;font-weight:700}
#bClose{display:none}
.mini #player{position:fixed;inset:auto;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:min(280px,62vw);height:auto;aspect-ratio:16/9;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14);z-index:50;touch-action:none}
.mini #title,.mini #bPip,.mini #bFull,.mini #bPrev,.mini #bNext,.mini #bMute{display:none}
.mini #bClose{display:grid}
.mini .cb{width:34px;height:34px}.mini .cb.big{width:44px;height:44px}
.mini .top{padding:6px 8px 16px;justify-content:flex-end}
.mini .bot{padding:16px 8px 8px}
.mini #msg{font-size:12px}

/* Sheet */
#sheet{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);z-index:100}
#sheet.show{display:flex}
.card{width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--panel2);border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){#sheet{align-items:center}.card{border-radius:22px}}
.card h2{margin:0;font-size:22px}
.card label{display:flex;flex-direction:column;gap:6px;color:var(--mu);font-size:13px}
.card input[type=url],.card textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;outline:0}
.card input:focus,.card textarea:focus{border-color:var(--ac)}
.card textarea{height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.btn,.card button{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center}
.card .seg button{height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent}
.card .seg button.on{background:var(--panel2)}
.card .pri{background:var(--ac);border-color:var(--ac);color:#241a05;font-weight:700}
.card .danger{color:#ff9d8f}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row>*{flex:0 0 auto}
.card details{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card summary{cursor:pointer;color:var(--mu)}
.card details[open] summary{margin-bottom:10px}
#st{margin:0;min-height:1.3em;color:var(--mu);font-size:14px}
#st.err{color:#ffb4a8}
#st.ok{color:#9fe3b0}
</style>
</head>
<body>
<div id="app" class="side-left">
  <aside id="side">
    <header>
      <div class="brand">IPTV<small id="cnt">Keine Liste geladen</small></div>
      <button class="ib" id="bRef" data-i="refresh" aria-label="Liste aktualisieren"></button>
      <button class="ib" id="bSet" data-i="gear" aria-label="Einstellungen"></button>
    </header>
    <div class="tools">
      <input id="q" type="search" placeholder="Sender suchen" enterkeyhint="search" autocapitalize="off" autocorrect="off">
      <div class="seg" id="tabs"><button data-t="all" class="on">Alle</button><button data-t="fav" aria-label="Favoriten" data-i="star"></button></div>
    </div>
    <div id="list"></div>
  </aside>
  <main id="stage">
    <div id="player">
      <video id="v" playsinline webkit-playsinline autoplay></video>
      <div id="ph">Wähle einen Sender aus der Liste.</div>
      <div id="msg"></div>
      <div id="ctl">
        <div class="top">
          <div id="title"></div>
          <button class="cb" id="bPip" aria-label="Bild-in-Bild über anderen Apps">PiP</button>
          <button class="cb" id="bMini" data-i="mini" aria-label="Mini-Fenster"></button>
          <button class="cb" id="bFull" data-i="full" aria-label="Vollbild"></button>
          <button class="cb" id="bClose" data-i="close" aria-label="Wiedergabe beenden"></button>
        </div>
        <div class="bot">
          <button class="cb" id="bPrev" data-i="prev" aria-label="Voriger Sender"></button>
          <button class="cb big" id="bPlay" data-i="pause" aria-label="Wiedergabe"></button>
          <button class="cb" id="bNext" data-i="next" aria-label="Nächster Sender"></button>
          <button class="cb" id="bMute" data-i="vol" aria-label="Ton"></button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="sheet"><div class="card">
  <h2>Senderliste</h2>
  <label>M3U-Link<input id="iUrl" type="url" inputmode="url" placeholder="https://…/liste.m3u" autocapitalize="off" autocorrect="off"></label>
  <button class="pri" id="bUrl">Liste laden</button>
  <details>
    <summary>Link geht nicht? Text einfügen oder Datei wählen</summary>
    <textarea id="iTxt" placeholder="#EXTM3U&#10;#EXTINF:-1 group-title=&quot;News&quot;,Sender&#10;https://…"></textarea>
    <div class="row">
      <button id="bTxt">Text laden</button>
      <label class="btn" style="flex-direction:row;color:var(--tx);font-size:inherit">Datei wählen<input id="iFile" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl" hidden></label>
    </div>
  </details>
  <div class="row between"><span>Position der Liste</span><div class="seg" id="sideSeg"><button data-s="left">Links</button><button data-s="right">Rechts</button></div></div>
  <p id="st"></p>
  <div class="row between"><button id="bDel" class="danger">Liste löschen</button><button id="bShut">Fertig</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const I={
  play:'M8 5v14l11-7z',
  pause:'M6 19h4V5H6v14zm8-14v14h4V5h-4z',
  prev:'M6 6h2v12H6zm3.5 6l8.5 6V6z',
  next:'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',
  vol:'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z',
  mute:'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z',
  full:'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z',
  mini:'M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z',
  open:'M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z',
  close:'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  gear:'M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.9 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 0 0-.6.22L2.69 8.87a.48.48 0 0 0 .12.64l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.37.29.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z',
  star:'M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z',
  refresh:'M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z'
};
const ico=n=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="${I[n]}"/></svg>`;
document.querySelectorAll('[data-i]').forEach(b=>b.innerHTML=ico(b.dataset.i));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ls(k,v){try{if(v===undefined)return localStorage.getItem('iptv.'+k);localStorage.setItem('iptv.'+k,v);return true}catch(e){return false}}

const app=$('#app'),v=$('#v'),P=$('#player'),ctl=$('#ctl'),L=$('#list');
const S={ch:[],gmap:new Map(),open:new Set(),cur:-1,tab:'all',live:false,hls:null,
  fav:new Set((()=>{try{return JSON.parse(ls('fav')||'[]')}catch(e){return[]}})())};

/* ---------- M3U ---------- */
function parse(txt){
  const out=[];let meta=null;
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      let q=false,c=-1;
      for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"')q=!q;else if(ch===','&&!q){c=i;break}}
      const head=c<0?l:l.slice(0,c);
      const a=k=>{const m=head.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1].trim():''};
      meta={name:(c<0?'':l.slice(c+1).trim())||a('tvg-name')||'Sender',logo:a('tvg-logo'),group:a('group-title')};
    }else if(l.startsWith('#EXTGRP:')){
      if(!meta)meta={};
      if(!meta.group)meta.group=l.slice(8).trim();
    }else if(l[0]!=='#'){
      out.push({name:meta&&meta.name||l.split('/').pop(),logo:meta&&meta.logo||'',group:meta&&meta.group||'Ohne Gruppe',url:l});
      meta=null;
    }
  }
  return out;
}

/* ---------- Liste ---------- */
function row(i){
  const c=S.ch[i],d=document.createElement('div');
  d.className='ch'+(i===S.cur?' on':'');d.dataset.i=i;
  const ini=esc((c.name.trim()[0]||'?').toUpperCase());
  d.innerHTML=(c.logo
    ?`<img class="lg" loading="lazy" referrerpolicy="no-referrer" alt="${ini}" src="${esc(c.logo)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'lg',textContent:this.alt}))">`
    :`<div class="lg">${ini}</div>`)
    +`<div class="nm"><b>${esc(c.name)}</b><small>${esc(c.group)}</small></div><button class="st${S.fav.has(c.url)?' on':''}" aria-label="Favorit">${ico('star')}</button>`;
  return d;
}
function render(){
  L.innerHTML='';
  $('#cnt').textContent=S.ch.length?`${S.ch.length} Sender`:'Keine Liste geladen';
  if(!S.ch.length){L.innerHTML='<div class="empty">Noch keine Liste. Tippe oben auf das Zahnrad und füge deinen M3U-Link ein.</div>';return}
  const term=$('#q').value.trim().toLowerCase();
  let ids=S.ch.map((_,i)=>i);
  if(S.tab==='fav')ids=ids.filter(i=>S.fav.has(S.ch[i].url));
  if(term){
    ids=ids.filter(i=>S.ch[i].name.toLowerCase().includes(term)||S.ch[i].group.toLowerCase().includes(term));
    if(!ids.length){L.innerHTML='<div class="empty">Kein Sender gefunden.</div>';return}
    const f=document.createDocumentFragment();ids.slice(0,400).forEach(i=>f.append(row(i)));
    if(ids.length>400){const n=document.createElement('div');n.className='empty';n.textContent=`${ids.length-400} weitere Treffer – Suche eingrenzen.`;f.append(n)}
    L.append(f);return;
  }
  if(!ids.length){L.innerHTML='<div class="empty">Noch keine Favoriten. Tippe beim Sender auf den Stern.</div>';return}
  S.gmap=new Map();
  ids.forEach(i=>{const k=S.ch[i].group;if(!S.gmap.has(k))S.gmap.set(k,[]);S.gmap.get(k).push(i)});
  const all=S.tab==='fav',f=document.createDocumentFragment();
  for(const [k,list] of S.gmap){
    const sec=document.createElement('section'),h=document.createElement('button'),b=document.createElement('div');
    h.className='gh';h.dataset.k=k;h.innerHTML=`<i></i><span>${esc(k)}</span><em>${list.length}</em>`;
    b.className='gb';sec.append(h,b);
    if(all||S.open.has(k)){sec.classList.add('open');b.append(...list.map(row))}
    f.append(sec);
  }
  L.append(f);
}
L.addEventListener('click',e=>{
  const gh=e.target.closest('.gh');
  if(gh){
    const sec=gh.parentElement,b=sec.querySelector('.gb'),k=gh.dataset.k;
    const o=sec.classList.toggle('open');o?S.open.add(k):S.open.delete(k);
    if(o&&!b.children.length)b.append(...S.gmap.get(k).map(row));
    return;
  }
  const r=e.target.closest('.ch');if(!r)return;
  const i=+r.dataset.i;
  if(e.target.closest('.st')){
    const u=S.ch[i].url;S.fav.has(u)?S.fav.delete(u):S.fav.add(u);
    ls('fav',JSON.stringify([...S.fav]));
    if(S.tab==='fav'){const y=L.scrollTop;render();L.scrollTop=y}
    else e.target.closest('.st').classList.toggle('on');
    return;
  }
  play(i);
});
let qT;$('#q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(render,120)});
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  S.tab=b.dataset.t||'fav';
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
function mark(){
  document.querySelectorAll('.ch.on').forEach(e=>e.classList.remove('on'));
  const e=document.querySelector(`.ch[data-i="${S.cur}"]`);if(e)e.classList.add('on');
}

/* ---------- Wiedergabe ---------- */
let T,wake=null;
const msg=(t,err)=>{const m=$('#msg');m.textContent=t||'';m.className=err?'err':''};
function poke(){ctl.classList.add('show');clearTimeout(T);T=setTimeout(()=>{if(!v.paused)ctl.classList.remove('show')},3200)}
function updPlay(){$('#bPlay').innerHTML=ico(v.paused?'play':'pause')}
async function lock(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
function stopStream(){
  if(S.hls){S.hls.destroy();S.hls=null}
  v.pause();v.removeAttribute('src');v.load();lock(false);
}
function load(u){
  stopStream();msg('Lädt …');
  const native=v.canPlayType('application/vnd.apple.mpegurl');
  if(native||!(window.Hls&&Hls.isSupported())){
    v.src=u;v.play().catch(()=>{});
  }else{
    const h=new Hls({lowLatencyMode:true});S.hls=h;
    h.loadSource(u);h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    h.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)msg('Sender nicht erreichbar. Wähle einen anderen oder versuche es später erneut.',true)});
  }
}
function play(i){
  const c=S.ch[i];if(!c)return;
  S.cur=i;S.live=true;ls('last',c.url);
  $('#title').textContent=c.name;P.classList.add('has');
  load(c.url);mark();poke();
  try{
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({title:c.name,artist:c.group,artwork:c.logo?[{src:c.logo}]:[]});
      navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));
      navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));
    }
  }catch(e){}
}
function step(d){
  if(S.cur<0)return;
  const g=S.ch[S.cur].group,ids=[];
  S.ch.forEach((c,i)=>{if(c.group===g)ids.push(i)});
  play(ids[(ids.indexOf(S.cur)+d+ids.length)%ids.length]);
}
function closePlayer(){
  stopStream();S.live=false;P.classList.remove('has');msg('');
  $('#title').textContent='';setMini(false);ctl.classList.remove('show');
}
v.addEventListener('playing',()=>{msg('');updPlay();lock(true)});
v.addEventListener('pause',()=>{updPlay();ctl.classList.add('show')});
v.addEventListener('play',updPlay);
v.addEventListener('waiting',()=>{if(S.live)msg('Puffert …')});
v.addEventListener('error',()=>{if(S.live&&!S.hls)msg('Dieser Sender lässt sich hier nicht abspielen.',true)});

$('#bPlay').onclick=()=>{
  if(!S.live&&S.cur>=0){play(S.cur);return}
  v.paused?v.play().catch(()=>{}):v.pause();poke();
};
$('#bPrev').onclick=()=>{step(-1)};
$('#bNext').onclick=()=>{step(1)};
$('#bMute').onclick=()=>{v.muted=!v.muted;$('#bMute').innerHTML=ico(v.muted?'mute':'vol');poke()};

/* Vollbild */
function full(){
  const fe=document.fullscreenElement||document.webkitFullscreenElement;
  if(fe){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(!S.live)return;
  setMini(false);
  if(P.requestFullscreen)P.requestFullscreen().catch(()=>v.webkitEnterFullscreen&&v.webkitEnterFullscreen());
  else if(P.webkitRequestFullscreen)P.webkitRequestFullscreen();
  else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();
}
$('#bFull').onclick=()=>{full();poke()};
P.addEventListener('dblclick',e=>{if(!app.classList.contains('mini')&&!e.target.closest('button'))full()});

/* Bild-in-Bild (System, über anderen Apps) */
async function pip(){
  try{
    if(document.pictureInPictureElement){await document.exitPictureInPicture();return}
    if(v.requestPictureInPicture)await v.requestPictureInPicture();
    else if(v.webkitSetPresentationMode)v.webkitSetPresentationMode(v.webkitPresentationMode==='picture-in-picture'?'inline':'picture-in-picture');
  }catch(e){msg('Bild-in-Bild ist auf diesem Gerät nicht verfügbar.',true)}
}
if(!(document.pictureInPictureEnabled||v.webkitSetPresentationMode))$('#bPip').style.display='none';
$('#bPip').onclick=()=>{pip();poke()};

/* Mini-Fenster (in der App, verschiebbar) */
function setMini(on){
  if(on&&!S.live)return;
  if(on&&(document.fullscreenElement||document.webkitFullscreenElement))(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  app.classList.toggle('mini',on);
  ['left','top','right','bottom'].forEach(k=>P.style[k]='');
  $('#bMini').innerHTML=ico(on?'open':'mini');
  $('#bMini').setAttribute('aria-label',on?'Mini-Fenster vergrößern':'Mini-Fenster');
}
$('#bMini').onclick=()=>{setMini(!app.classList.contains('mini'));poke()};
$('#bClose').onclick=closePlayer;

let drag=null,swallow=false;
function pos(x,y){
  const w=P.offsetWidth,h=P.offsetHeight;
  x=Math.min(Math.max(4,x),innerWidth-w-4);y=Math.min(Math.max(4,y),innerHeight-h-4);
  P.style.left=x+'px';P.style.top=y+'px';P.style.right='auto';P.style.bottom='auto';
}
P.addEventListener('pointerdown',e=>{
  if(!app.classList.contains('mini')||e.target.closest('button'))return;
  const r=P.getBoundingClientRect();
  drag={dx:e.clientX-r.left,dy:e.clientY-r.top,x:e.clientX,y:e.clientY,moved:false};
  P.setPointerCapture(e.pointerId);
});
P.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>6)drag.moved=true;
  if(drag.moved)pos(e.clientX-drag.dx,e.clientY-drag.dy);
});
const endDrag=()=>{if(drag&&drag.moved){swallow=true;setTimeout(()=>swallow=false,60)}drag=null};
P.addEventListener('pointerup',endDrag);P.addEventListener('pointercancel',endDrag);
addEventListener('resize',()=>{if(app.classList.contains('mini')&&P.style.left)pos(parseFloat(P.style.left),parseFloat(P.style.top))});

P.addEventListener('click',e=>{
  if(swallow)return;
  if(e.target.closest('button')){poke();return}
  if(!S.live)return;
  ctl.classList.contains('show')?ctl.classList.remove('show'):poke();
});

/* Tastatur (iPad mit Tastatur) */
addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key===' '){e.preventDefault();$('#bPlay').click()}
  else if(e.key==='f'||e.key==='F')full();
  else if(e.key==='m'||e.key==='M')$('#bMute').click();
  else if(e.key==='ArrowUp')step(-1);
  else if(e.key==='ArrowDown')step(1);
});

/* ---------- Einstellungen ---------- */
const sheet=$('#sheet'),st=(t,c)=>{const p=$('#st');p.textContent=t||'';p.className=c||''};
const openSheet=()=>{$('#iUrl').value=ls('src')||'';st('');sheet.classList.add('show')};
const closeSheet=()=>sheet.classList.remove('show');
$('#bSet').onclick=openSheet;$('#bShut').onclick=closeSheet;
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});

function ingest(t,src,silent){
  const ch=parse(t);
  if(!ch.length){st('In dieser Liste wurden keine Sender gefunden.','err');return false}
  S.ch=ch;S.open.clear();S.cur=-1;
  if(!silent){
    ls('text','');ls('text',t);ls('src',src||'');
  }
  const last=ls('last'),i=last?ch.findIndex(c=>c.url===last):-1;
  if(i>=0){S.cur=i;S.open.add(ch[i].group)}
  render();
  if(i>=0){const e=document.querySelector(`.ch[data-i="${i}"]`);if(e)e.scrollIntoView({block:'center'})}
  if(!silent){st(`${ch.length} Sender geladen.`,'ok');setTimeout(closeSheet,500)}
  return true;
}
async function fromUrl(u,silent){
  u=(u||'').trim();
  if(!/^https?:\/\//i.test(u)){st('Bitte einen Link mit http:// oder https:// eingeben.','err');return}
  st('Lädt …');
  try{
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);
    ingest(await r.text(),u,silent);
  }catch(e){
    st('Der Link ließ sich nicht laden. Manche Anbieter blockieren fremde Webseiten (CORS). Öffne „Link geht nicht?“ und füge den Listentext ein oder wähle die Datei.','err');
    if(silent)openSheet();
  }
}
$('#bUrl').onclick=()=>fromUrl($('#iUrl').value);
$('#bTxt').onclick=()=>{const t=$('#iTxt').value.trim();if(t)ingest(t,'')};
$('#iFile').onchange=async e=>{const f=e.target.files[0];if(f)ingest(await f.text(),'');e.target.value=''};
$('#bRef').onclick=()=>{const s=ls('src');s&&/^https?:/i.test(s)?fromUrl(s):openSheet()};
$('#bDel').onclick=()=>{
  if(!confirm('Gespeicherte Senderliste wirklich löschen? Favoriten bleiben erhalten.'))return;
  closePlayer();S.ch=[];S.cur=-1;['text','src','last'].forEach(k=>ls(k,''));render();st('Liste gelöscht.');
};
function setSide(s){
  app.classList.remove('side-left','side-right');app.classList.add('side-'+s);ls('side',s);
  document.querySelectorAll('#sideSeg button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
}
$('#sideSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setSide(b.dataset.s)});

/* ---------- Start ---------- */
setSide(ls('side')||'left');
(function(){
  const t=ls('text'),src=ls('src');
  if(t&&ingest(t,src,true))return;
  render();
  if(src&&/^https?:/i.test(src))fromUrl(src,true);else openSheet();
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
